resolver 127.0.0.11 valid=30s ipv6=off;

upstream dojo_frontend {
    zone dojo_frontend 64k;
    server frontend:3000 resolve;
}

upstream dojo_backend {
    zone dojo_backend 64k;
    server backend:8080 resolve;
}

upstream solstay_app {
    zone solstay_app 64k;
    server solstay-app:80 resolve;
}

# Spring Boot Dojo
server {
    listen 80;
    server_name spring-dojo.duckdns.org _;

    client_max_body_size 2m;

    location / {
        proxy_pass http://dojo_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://dojo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# SolStay (Laravel) — contenedor solstay-app en la red portfolio-net
server {
    listen 80;
    server_name solstay.duckdns.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://solstay_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
